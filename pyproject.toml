[project]
name = "nutft"
version = "0.1.0"
description = "A small Nutshell-based prototype for private collectible ecash"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cashu==0.20.2",
    "marshmallow<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[project.scripts]
nutft-demo = "nutft.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutft"]
